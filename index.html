<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse — live scores</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0F1626; --panel:#1A2336; --panel2:#202C44; --line:#2A3650; --ink:#F2F5FB; --quiet:#93A1BC;
    --live:#FFB224; --live-ink:#231A05; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; }
  .phone { max-width:430px; margin:0 auto; min-height:100vh; }

  header { position:sticky; top:0; z-index:10; background:rgba(15,22,38,.82); backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); padding:14px 20px 12px;
    display:flex; flex-direction:column; gap:12px; }
  .brandrow { display:flex; justify-content:space-between; align-items:center; }
  .brand { font-family:'Oswald',sans-serif; font-size:26px; font-weight:700; letter-spacing:.5px; line-height:1; }
  .brand .bulb { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--live);
    margin-left:6px; vertical-align:12px; }
  .livepill { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:var(--live);
    border:1px solid #4A3C14; background:rgba(255,178,36,.08); border-radius:999px; padding:6px 12px; }
  .livepill .dot { width:7px; height:7px; border-radius:50%; background:var(--live); animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  @media (prefers-reduced-motion: reduce) { .livepill .dot { animation:none } }
  .seg { display:flex; background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:3px; }
  .seg button { flex:1; background:none; border:none; border-radius:8px; color:var(--quiet); font-family:inherit;
    font-size:13px; font-weight:600; padding:8px 0; cursor:pointer; }
  .seg button.on { background:var(--panel2); color:var(--ink); }
  .chips { display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none }
  .chip { flex-shrink:0; background:transparent; border:1px solid var(--line); border-radius:999px; color:var(--quiet);
    font-family:inherit; font-size:12.5px; font-weight:600; padding:7px 13px; min-height:34px; cursor:pointer; }
  .chip.on { background:var(--ink); border-color:var(--ink); color:var(--bg); font-weight:700; }
  .chip:focus-visible, .seg button:focus-visible, .card:focus-visible, .back:focus-visible, .watch:focus-visible {
    outline:2px solid var(--live); outline-offset:2px; }

  main { padding:16px 20px 60px; display:flex; flex-direction:column; gap:22px; }
  .datefact { font-size:13px; color:var(--quiet); }

  .hero { display:flex; flex-direction:column; gap:12px; background:var(--panel); border:1px solid #4A3C14;
    border-radius:16px; padding:16px; cursor:pointer; }
  .herotop { display:flex; justify-content:space-between; align-items:center; }
  .heroleague { font-family:'Oswald',sans-serif; font-size:14px; font-weight:600; letter-spacing:1px; color:var(--quiet); }
  .heroclock { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--live); }
  .heroclock .dot { width:7px; height:7px; border-radius:50%; background:var(--live); animation:pulse 1.4s infinite; }
  .heroteam { display:flex; justify-content:space-between; align-items:center; }
  .heroteam .who { display:flex; align-items:center; gap:11px; font-size:16px; font-weight:700; }
  .heroteam .logo { width:34px; height:34px; }
  .heroteam .num { font-family:'Oswald',sans-serif; font-size:36px; font-weight:600; line-height:1; }
  .herohint { font-size:12px; color:var(--quiet); }

  .section { display:flex; flex-direction:column; gap:10px; }
  .sechead { display:flex; align-items:baseline; gap:10px; border-bottom:1px solid var(--line); padding-bottom:7px; }
  .secname { font-family:'Oswald',sans-serif; font-size:16px; font-weight:600; letter-spacing:1px; }
  .seclive { font-size:12px; font-weight:700; color:var(--live); }
  .seccount { margin-left:auto; font-size:12px; color:var(--quiet); }

  .card { display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line);
    border-radius:13px; padding:12px 14px; cursor:pointer; }
  .card.live { border-color:#4A3C14; }
  .teams { display:flex; flex-direction:column; gap:8px; flex:1; min-width:0; }
  .team { display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; }
  .team.lost { color:var(--quiet); }
  .team .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .logo { width:22px; height:22px; flex-shrink:0; border-radius:50%; background:var(--panel2); object-fit:contain; }
  .scores { display:flex; flex-direction:column; gap:8px; align-items:flex-end;
    font-family:'Oswald',sans-serif; font-size:18px; font-weight:600; min-width:26px; line-height:1.2; }
  .scores .lost { color:var(--quiet); }
  .status { display:flex; flex-direction:column; align-items:flex-end; gap:4px; width:72px; flex-shrink:0; }
  .badge { font-size:10px; font-weight:800; color:var(--live-ink); background:var(--live); border-radius:4px; padding:2px 7px; }
  .ftchip { font-size:10px; font-weight:700; color:var(--quiet); border:1px solid var(--line); border-radius:4px; padding:3px 7px; }
  .meta { font-size:11px; font-weight:600; color:var(--quiet); text-align:right; }
  .time { font-family:'Oswald',sans-serif; font-size:15px; font-weight:600; }

  .empty, .error { font-size:13px; color:var(--quiet); background:var(--panel); border:1px dashed var(--line);
    border-radius:13px; padding:16px; }
  .empty strong { color:var(--ink); }
  .stamp { font-size:11px; color:var(--quiet); text-align:center; }
  .skel { height:68px; border-radius:13px; background:linear-gradient(90deg,#1A2336 25%,#202C44 50%,#1A2336 75%);
    background-size:200% 100%; animation:sh 1.2s infinite; }
  @keyframes sh { from{background-position:200% 0} to{background-position:-200% 0} }
  @media (prefers-reduced-motion: reduce) { .skel { animation:none } }

  .back { display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--ink);
    font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; padding:0; min-height:44px; }
  .dwrap { animation:drop .18s ease-out; }
  @keyframes drop { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
  @media (prefers-reduced-motion: reduce) { .dwrap { animation:none } }
  .dcard { display:flex; flex-direction:column; gap:16px; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:20px 16px; }
  .dcard.live { border-color:#4A3C14; }
  .dstatus { display:flex; justify-content:center; align-items:center; gap:8px; }
  .drow { display:flex; justify-content:space-between; align-items:center; }
  .dteam { display:flex; align-items:center; gap:11px; font-size:16px; font-weight:700; min-width:0; }
  .dteam.lost, .dscore.lost { color:var(--quiet); }
  .dteam .logo { width:36px; height:36px; }
  .dscore { font-family:'Oswald',sans-serif; font-size:38px; font-weight:600; line-height:1; }
  .lines { width:100%; border-collapse:collapse; font-size:12px; background:var(--bg); border-radius:10px; overflow:hidden; }
  .lines th, .lines td { padding:7px 5px; text-align:center; color:var(--quiet); }
  .lines thead tr { border-bottom:1px solid var(--line); }
  .lines td.nm { text-align:left; font-weight:600; color:var(--ink); padding-left:10px; }
  .lines td.sc { color:var(--ink); font-weight:600; font-family:'Oswald',sans-serif; font-size:14px; }
  .watch { display:flex; align-items:center; justify-content:center; gap:8px; background:var(--live);
    color:var(--live-ink); border-radius:12px; font-size:14px; font-weight:800; min-height:48px; text-decoration:none; }
  .dmeta { font-size:12px; color:var(--quiet); text-align:center; }
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="brandrow">
      <span class="brand">Pulse<span class="bulb" aria-hidden="true"></span></span>
      <div class="livepill"><span class="dot"></span><span id="liveCount">0 live</span></div>
    </div>
    <div class="seg" id="dayChips" role="group" aria-label="Day"></div>
    <div class="chips" id="countryChips" role="group" aria-label="Country"></div>
    <div class="chips" id="sportChips" role="group" aria-label="Sport"></div>
  </header>
  <main>
    <div class="datefact" id="dateLabel"></div>
    <div id="content"><div class="skel"></div></div>
    <div class="stamp" id="stamp">Loading today's games…</div>
  </main>
</div>
<script>
const LEAGUES = [
  { id:'nba',  label:'NBA',             path:'basketball/nba',          country:'us', sport:'basketball' },
  { id:'nfl',  label:'NFL',             path:'football/nfl',            country:'us', sport:'football' },
  { id:'nhl',  label:'NHL',             path:'hockey/nhl',              country:'ca', sport:'hockey' },
  { id:'mlb',  label:'MLB',             path:'baseball/mlb',            country:'us', sport:'baseball' },
  { id:'epl',  label:'Premier League',  path:'soccer/eng.1',            country:'uk', sport:'soccer' },
  { id:'ucl',  label:'Champions League',path:'soccer/uefa.champions',   country:'uk', sport:'soccer' },
  { id:'mls',  label:'MLS',             path:'soccer/usa.1',            country:'us', sport:'soccer' },
  { id:'afl',  label:'AFL',             path:'australian-football/afl', country:'au', sport:'afl' },
  { id:'nrl',  label:'NRL',             path:'rugby-league/3',          country:'au', sport:'rugby' }
];
const COUNTRIES = [ ['all','Everywhere'], ['us','USA'], ['ca','Canada'], ['uk','UK'], ['au','Australia'] ];
const SPORTS = [ ['all','All sports'], ['basketball','Basketball'], ['football','Football'], ['soccer','Soccer'],
  ['hockey','Hockey'], ['baseball','Baseball'], ['afl','Aussie Rules'], ['rugby','Rugby League'] ];
const DAYS = [ [-1,'Yesterday'], [0,'Today'], [1,'Tomorrow'] ];
const state = { country:'all', sport:'all', day:0, sel:null, data:{}, errors:{} };

function dateFor(offset) { const d = new Date(); d.setDate(d.getDate() + offset); return d; }
function ymd(d) { return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0'); }

function chipRow(el, items, key, cls, onPick) {
  el.innerHTML = '';
  for (const [id, label] of items) {
    const b = document.createElement('button');
    b.className = cls + (String(state[key]) === String(id) ? ' on' : '');
    b.textContent = label;
    b.onclick = () => { onPick(id); };
    el.appendChild(b);
  }
}
function renderChips() {
  chipRow(document.getElementById('dayChips'), DAYS, 'day', '', id => { state.day = Number(id); state.sel = null; refresh(true); });
  chipRow(document.getElementById('countryChips'), COUNTRIES, 'country', 'chip', id => { state.country = id; render(); });
  chipRow(document.getElementById('sportChips'), SPORTS, 'sport', 'chip', id => { state.sport = id; render(); });
}

async function fetchLeague(lg) {
  // "Today" omits the date: ESPN then returns the current slate (incl. live games),
  // which matters when the user's local date is ahead of US time.
  const url = 'https://site.api.espn.com/apis/site/v2/sports/' + lg.path + '/scoreboard' +
    (state.day === 0 ? '' : '?dates=' + ymd(dateFor(state.day)));
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    state.data[lg.id] = (j.events || []).map(ev => {
      const comp = (ev.competitions || [])[0] || {};
      const cs = comp.competitors || [];
      const home = cs.find(c => c.homeAway === 'home') || cs[0] || {};
      const away = cs.find(c => c.homeAway === 'away') || cs[1] || {};
      const st = (ev.status && ev.status.type) || {};
      return {
        id: String(ev.id),
        state: st.state || 'pre',
        detail: st.shortDetail || st.detail || '',
        date: ev.date,
        link: (ev.links && ev.links[0] && ev.links[0].href) || '',
        venue: (comp.venue && comp.venue.fullName) || '',
        nets: (((comp.broadcasts || [])[0] || {}).names || []).join(', '),
        home: { name: (home.team && (home.team.shortDisplayName || home.team.displayName)) || '—',
                logo: home.team && home.team.logo, score: home.score, won: home.winner === true,
                lines: (home.linescores || []).map(l => l.value) },
        away: { name: (away.team && (away.team.shortDisplayName || away.team.displayName)) || '—',
                logo: away.team && away.team.logo, score: away.score, won: away.winner === true,
                lines: (away.linescores || []).map(l => l.value) }
      };
    });
    delete state.errors[lg.id];
  } catch (e) { state.errors[lg.id] = true; state.data[lg.id] = state.data[lg.id] || []; }
}

const img = t => t.logo ? '<img class="logo" src="' + t.logo + '" alt="">' : '<span class="logo"></span>';
function teamRow(t, done, other) {
  const lost = done && !t.won && other.won;
  return '<div class="team' + (lost ? ' lost' : '') + '">' + img(t) + '<span class="nm">' + t.name + '</span></div>';
}

function card(g, lgId) {
  const live = g.state === 'in', done = g.state === 'post';
  let right;
  if (live) right = '<div class="status"><span class="badge">LIVE</span><span class="meta">' + g.detail + '</span></div>';
  else if (done) right = '<div class="status"><span class="ftchip">Final</span></div>';
  else {
    const t = g.date ? new Date(g.date).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }) : '';
    right = '<div class="status"><span class="time">' + t + '</span><span class="meta">your time</span></div>';
  }
  const sc = (t, other) => '<span class="' + (done && !t.won && other.won ? 'lost' : '') + '">' + (t.score ?? '') + '</span>';
  const scores = (live || done) ? '<div class="scores">' + sc(g.away, g.home) + sc(g.home, g.away) + '</div>' : '';
  return '<div class="card' + (live ? ' live' : '') + '" data-lg="' + lgId + '" data-id="' + g.id + '" tabindex="0" role="button">' +
    '<div class="teams">' + teamRow(g.away, done, g.home) + teamRow(g.home, done, g.away) + '</div>' + scores + right + '</div>';
}

function hero(g, lg) {
  const row = t => '<div class="heroteam"><div class="who">' + img(t) + '<span>' + t.name + '</span></div>' +
    '<span class="num">' + (t.score ?? '') + '</span></div>';
  return '<div class="hero" data-lg="' + lg.id + '" data-id="' + g.id + '" tabindex="0" role="button">' +
    '<div class="herotop"><span class="heroleague">' + lg.label + '</span>' +
    '<span class="heroclock"><span class="dot"></span>' + g.detail + '</span></div>' +
    row(g.away) + row(g.home) +
    '<div class="herohint">Open for the quarter-by-quarter score and where to watch</div></div>';
}

function renderDetail() {
  const lg = LEAGUES.find(l => l.id === state.sel.lg);
  const g = (state.data[state.sel.lg] || []).find(x => x.id === state.sel.id);
  const box = document.getElementById('content');
  if (!g || !lg) { state.sel = null; render(); return; }
  const live = g.state === 'in', done = g.state === 'post';
  const statusHtml = live
    ? '<span class="badge">LIVE</span><span class="meta">' + g.detail + '</span>'
    : done ? '<span class="ftchip">Final</span>'
    : '<span class="meta">' + (g.date ? new Date(g.date).toLocaleString([], { weekday:'short', hour:'numeric', minute:'2-digit' }) : '') + ' · your time</span>';
  const dRow = (t, other) => {
    const lost = done && !t.won && other.won;
    return '<div class="drow"><div class="dteam' + (lost ? ' lost' : '') + '">' + img(t) + '<span class="nm">' + t.name + '</span></div>' +
      '<span class="dscore' + (lost ? ' lost' : '') + '">' + (t.score ?? '') + '</span></div>';
  };
  const n = Math.max(g.home.lines.length, g.away.lines.length);
  let lines = '';
  if (n > 0) {
    let head = '<thead><tr><th></th>'; for (let i = 1; i <= n; i++) head += '<th>' + i + '</th>'; head += '<th>T</th></tr></thead>';
    const row = t => '<tr><td class="nm">' + t.name + '</td>' +
      Array.from({ length: n }, (_, i) => '<td class="sc">' + (t.lines[i] ?? '–') + '</td>').join('') +
      '<td class="sc">' + (t.score ?? '') + '</td></tr>';
    lines = '<table class="lines">' + head + '<tbody>' + row(g.away) + row(g.home) + '</tbody></table>';
  }
  const label = live ? 'Watch match live' : done ? 'Recap and highlights' : 'Match preview';
  const watch = g.link
    ? '<a class="watch" target="_blank" rel="noopener" href="' + g.link + '">' +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>' + label + '</a>' +
      '<div class="dmeta">Opens the official live game center' + (g.nets ? ' — on TV: ' + g.nets : '') + '</div>'
    : '';
  const meta = g.venue ? '<div class="dmeta" style="margin-top:10px">' + g.venue + '</div>' : '';
  box.innerHTML = '<div class="dwrap"><button class="back" id="backBtn">← All games</button>' +
    '<div class="section"><div class="sechead"><span class="secname">' + lg.label + '</span></div>' +
    '<div class="dcard' + (live ? ' live' : '') + '"><div class="dstatus">' + statusHtml + '</div>' +
    dRow(g.away, g.home) + dRow(g.home, g.away) + lines + watch + '</div>' + meta + '</div></div>';
  document.getElementById('backBtn').onclick = () => { state.sel = null; render(); };
}

function render() {
  renderChips();
  if (state.sel) { renderDetail(); return; }
  const d = dateFor(state.day);
  const dayName = d.toLocaleDateString([], { weekday:'long', month:'long', day:'numeric' });
  const box = document.getElementById('content');
  let html = '', liveTotal = 0, heroHtml = '', nGames = 0;
  for (const lg of LEAGUES) {
    if (state.country !== 'all' && lg.country !== state.country) continue;
    if (state.sport !== 'all' && lg.sport !== state.sport) continue;
    const games = state.data[lg.id] || [];
    const liveGames = games.filter(g => g.state === 'in');
    liveTotal += liveGames.length;
    nGames += games.length;
    if (!heroHtml && liveGames.length && state.day === 0) heroHtml = hero(liveGames[0], lg);
    if (state.errors[lg.id]) {
      html += '<div class="section"><div class="sechead"><span class="secname">' + lg.label + '</span></div>' +
        '<div class="error">This league didn’t load. It refreshes automatically — or pull down to retry.</div></div>';
    } else if (games.length) {
      html += '<div class="section"><div class="sechead"><span class="secname">' + lg.label + '</span>' +
        (liveGames.length ? '<span class="seclive">' + liveGames.length + ' live</span>' : '') +
        '<span class="seccount">' + games.length + ' game' + (games.length > 1 ? 's' : '') + '</span></div>' +
        games.map(g => card(g, lg.id)).join('') + '</div>';
    }
  }
  document.getElementById('dateLabel').textContent = state.day === 0
    ? dayName + (liveTotal ? ' — games in progress' : '')
    : dayName;
  box.innerHTML = (heroHtml || '') + html ||
    '<div class="empty"><strong>No games here.</strong><br>Try another day, or widen the country and sport filters above.</div>';
  if (!html && !heroHtml) box.innerHTML = '<div class="empty"><strong>No games for this view.</strong><br>Try another day, or widen the country and sport filters above.</div>';
  document.getElementById('liveCount').textContent = liveTotal + ' live';
}

async function refresh(showSkeleton) {
  if (showSkeleton) document.getElementById('content').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  await Promise.all(LEAGUES.map(fetchLeague));
  render();
  document.getElementById('stamp').textContent =
    'Scores refresh every 30 seconds · updated ' + new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit', second:'2-digit' });
}

document.getElementById('content').addEventListener('click', e => {
  const c = e.target.closest('[data-id]');
  if (c) { state.sel = { lg: c.dataset.lg, id: c.dataset.id }; render(); window.scrollTo(0, 0); }
});
document.getElementById('content').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const c = e.target.closest('[data-id]');
  if (c) { state.sel = { lg: c.dataset.lg, id: c.dataset.id }; render(); window.scrollTo(0, 0); }
});
renderChips();
refresh(true);
setInterval(() => { if (state.day === 0 && !document.hidden) refresh(false); }, 30000);
</script>
</body>
</html>
